name: Validate and Deploy Pages

# Publication fetching stays on the scheduled Mac because Substack blocks
# cloud datacenter traffic. GitHub receives only a validated source snapshot,
# then independently tests, builds, and atomically deploys it.
#
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    pages-${{
      github.event_name == 'pull_request'
      && github.event.pull_request.number
      || 'production'
    }}
  queue: max

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      html_sha256: ${{ steps.release.outputs.html_sha256 }}
      brief_sha256: ${{ steps.release.outputs.brief_sha256 }}
      observation_sha256: ${{ steps.release.outputs.observation_sha256 }}
      support_sha256: ${{ steps.release.outputs.support_sha256 }}
      data_sha256: ${{ steps.release.outputs.data_sha256 }}
      share_sha256: ${{ steps.release.outputs.share_sha256 }}
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned quality tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check \
              mypy==1.11.2 ruff==0.12.4; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Quality tool download retry::Attempt $attempt failed; retrying the pinned install."
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error title=Quality tool installation failed::Pinned quality tools could not be installed after three attempts."
          exit 1

      - name: Lint Python
        run: ruff check *.py

      - name: Type-check production Python
        run: mypy --cache-dir "$RUNNER_TEMP/mypy-cache"

      - name: Run regression suite
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Validate deployable data snapshot
        shell: bash
        env:
          BASELINE_SHA: >-
            ${{
              github.event_name == 'push'
              && github.event.before
              || github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || ''
            }}
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/previous-snapshot"
          mkdir -p "$previous_dir"
          validation_args=(
            --articles articles_index.json
            --trades trades_extracted.json
            --manifest snapshot_manifest.json
          )

          if [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$BASELINE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "$BASELINE_SHA:articles_index.json" 2>/dev/null \
            && git cat-file -e "$BASELINE_SHA:trades_extracted.json" 2>/dev/null \
            && git cat-file -e "$BASELINE_SHA:snapshot_manifest.json" 2>/dev/null; then
            git show "$BASELINE_SHA:articles_index.json" > "$previous_dir/articles_index.json"
            git show "$BASELINE_SHA:trades_extracted.json" > "$previous_dir/trades_extracted.json"
            git show "$BASELINE_SHA:snapshot_manifest.json" > "$previous_dir/snapshot_manifest.json"
            validation_args+=(
              --previous-articles "$previous_dir/articles_index.json"
              --previous-trades "$previous_dir/trades_extracted.json"
              --previous-manifest "$previous_dir/snapshot_manifest.json"
            )
          else
            echo "No complete prior manifest-backed snapshot; validating current snapshot only."
          fi

          python validate_pipeline.py "${validation_args[@]}"

      - name: Prove tests did not mutate release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build immutable site artifact
        env:
          SITE_OUTPUT_DIR: ${{ github.workspace }}/_site
          SITE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test ! -e _site
          python build_site.py

      - name: Compile generated inline JavaScript
        run: python validate_inline_scripts.py _site/index.html

      - name: Validate and fingerprint exact release artifact
        id: release
        run: >-
          python validate_release.py
          --site _site
          --articles articles_index.json
          --trades trades_extracted.json
          --manifest snapshot_manifest.json
          --expected-revision "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Prove build kept release inputs immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Prepare verified emergency rollback bundle
        run: >-
          python rollback_bundle.py create
          --site _site
          --articles articles_index.json
          --trades trades_extracted.json
          --manifest snapshot_manifest.json
          --revision "${{ github.sha }}"
          --output "$RUNNER_TEMP/verified-pages"

      - name: Revalidate copied rollback bundle
        run: >-
          python rollback_bundle.py validate
          --bundle "$RUNNER_TEMP/verified-pages"
          --expected-revision "${{ github.sha }}"

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 7

      - name: Retain verified rollback bundle
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: verified-pages-${{ github.sha }}
          path: ${{ runner.temp }}/verified-pages
          retention-days: 90

  currency:
    name: Confirm current production revision
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.remote.outputs.current }}
    permissions:
      contents: read

    steps:
      - name: Compare release with remote main
        id: remote
        shell: bash
        env:
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          remote_main=
          for attempt in 1 2 3; do
            remote_main=$(
              git ls-remote --exit-code "$REMOTE_URL" refs/heads/main 2>/dev/null |
                awk 'NR == 1 { print $1 }'
            ) || remote_main=
            if [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Remote main retry::Could not prove remote main on attempt $attempt."
              sleep "$((attempt * 5))"
            fi
          done
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Remote main unavailable::Could not prove the current production revision after three attempts."
            exit 1
          fi
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded release skipped::This successful quality run targets $GITHUB_SHA; newer main $remote_main owns the next production deployment."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.quality.result == 'success'
      && needs.currency.result == 'success'
      && needs.currency.outputs.current == 'true'
    needs:
      - quality
      - currency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out smoke test and expected snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify exact release is live
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_HTML_SHA256: ${{ needs.quality.outputs.html_sha256 }}
          EXPECTED_BRIEF_SHA256: ${{ needs.quality.outputs.brief_sha256 }}
          EXPECTED_OBSERVATION_SHA256: ${{ needs.quality.outputs.observation_sha256 }}
          EXPECTED_SUPPORT_SHA256: ${{ needs.quality.outputs.support_sha256 }}
          EXPECTED_DATA_SHA256: ${{ needs.quality.outputs.data_sha256 }}
          EXPECTED_SHARE_SHA256: ${{ needs.quality.outputs.share_sha256 }}
        run: >-
          python smoke_test_site.py "$DEPLOYED_URL"
          --expected-revision "$EXPECTED_REVISION"
          --articles-file articles_index.json
          --observations-file trades_extracted.json
          --expected-html-sha256 "$EXPECTED_HTML_SHA256"
          --expected-brief-sha256 "$EXPECTED_BRIEF_SHA256"
          --expected-observation-sha256 "$EXPECTED_OBSERVATION_SHA256"
          --expected-support-sha256 "$EXPECTED_SUPPORT_SHA256"
          --expected-data-sha256 "$EXPECTED_DATA_SHA256"
          --expected-share-sha256 "$EXPECTED_SHARE_SHA256"
          --retries 8
          --retry-delay 10
          --timeout 20

      - name: Publish production incident guidance
        if: failure() && steps.deployment.outcome == 'success'
        run: >-
          echo "::error title=Production verification failed::The Pages upload
          completed but exact live verification failed. Follow LAUNCH_RUNBOOK.md
          section 6; do not certify this release."
