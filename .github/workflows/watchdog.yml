name: Monitor Published Research

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-research-watchdog
  queue: max

jobs:
  monitor:
    name: Verify live release and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the expected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the expected release still owns main
        id: currency
        shell: bash
        run: |
          set -euo pipefail
          remote_main=
          for attempt in 1 2 3; do
            remote_main=$(
              git ls-remote --exit-code origin refs/heads/main 2>/dev/null |
                awk 'NR == 1 { print $1 }'
            ) || remote_main=
            if [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Watchdog remote retry::Could not prove remote main on attempt $attempt."
              sleep "$((attempt * 5))"
            fi
          done
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Watchdog authority unavailable::Could not prove remote main after three attempts."
            exit 1
          fi
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded watchdog skipped::This watcher targets $GITHUB_SHA; current main is $remote_main."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Set up deterministic Python
        if: steps.currency.outputs.current == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Rebuild and validate trusted release
        if: steps.currency.outputs.current == 'true'
        id: release
        shell: bash
        env:
          SITE_OUTPUT_DIR: ${{ runner.temp }}/expected-site
          SITE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test ! -e "$SITE_OUTPUT_DIR"
          python3 build_site.py
          python3 validate_release.py \
            --site "$SITE_OUTPUT_DIR" \
            --articles articles_index.json \
            --trades trades_extracted.json \
            --manifest snapshot_manifest.json \
            --expected-revision "$SITE_REVISION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify exact live release with bounded propagation retries
        if: steps.currency.outputs.current == 'true'
        id: smoke
        continue-on-error: true
        env:
          EXPECTED_HTML_SHA256: ${{ steps.release.outputs.html_sha256 }}
          EXPECTED_BRIEF_SHA256: ${{ steps.release.outputs.brief_sha256 }}
          EXPECTED_OBSERVATION_SHA256: ${{ steps.release.outputs.observation_sha256 }}
          EXPECTED_SUPPORT_SHA256: ${{ steps.release.outputs.support_sha256 }}
          EXPECTED_DATA_SHA256: ${{ steps.release.outputs.data_sha256 }}
          EXPECTED_SHARE_SHA256: ${{ steps.release.outputs.share_sha256 }}
        run: >-
          python3 smoke_test_site.py
          --expected-revision "$GITHUB_SHA"
          --articles-file articles_index.json
          --observations-file trades_extracted.json
          --expected-html-sha256 "$EXPECTED_HTML_SHA256"
          --expected-brief-sha256 "$EXPECTED_BRIEF_SHA256"
          --expected-observation-sha256 "$EXPECTED_OBSERVATION_SHA256"
          --expected-support-sha256 "$EXPECTED_SUPPORT_SHA256"
          --expected-data-sha256 "$EXPECTED_DATA_SHA256"
          --expected-share-sha256 "$EXPECTED_SHARE_SHA256"
          --retries 20
          --retry-delay 20
          --timeout 10
          https://navnoorthapar.github.io/substack-trades/

      - name: Reconcile a failed check with current main
        if: >-
          steps.currency.outputs.current == 'true'
          && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          remote_main=
          for attempt in 1 2 3; do
            remote_main=$(
              git ls-remote --exit-code origin refs/heads/main 2>/dev/null |
                awk 'NR == 1 { print $1 }'
            ) || remote_main=
            if [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Watchdog reconciliation retry::Could not prove remote main on attempt $attempt."
              sleep "$((attempt * 5))"
            fi
          done
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Watchdog reconciliation unavailable::The exact-release check failed and remote main could not be proven."
            exit 1
          fi
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::notice title=Superseded watchdog reconciled::The failed check targeted $GITHUB_SHA; newer main $remote_main now owns release verification."
            exit 0
          fi
          echo "::error title=Published release verification failed::Main still equals $GITHUB_SHA and the bounded exact-release check failed."
          exit 1

      - name: Enforce scheduled-refresh freshness
        if: >-
          steps.currency.outputs.current == 'true'
          && steps.smoke.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          snapshot = json.load(open('snapshot_manifest.json', encoding='utf-8'))
          checked_at = datetime.fromisoformat(str(snapshot['checked_at']).replace('Z', '+00:00'))
          now = datetime.now(timezone.utc)
          future_cutoff = now + timedelta(minutes=10)
          maximum_age = timedelta(hours=16)
          maximum_source_lag = timedelta(hours=1)
          if checked_at.astimezone(timezone.utc) > future_cutoff:
              raise SystemExit('Published research snapshot check time is implausibly far in the future')
          for source, status in snapshot.get('sources', {}).items():
              source_checked = datetime.fromisoformat(str(status['checked_at']).replace('Z', '+00:00'))
              source_checked = source_checked.astimezone(timezone.utc)
              if source_checked > future_cutoff:
                  raise SystemExit(f'{source} check time is implausibly far in the future')
              if source_checked > checked_at.astimezone(timezone.utc):
                  raise SystemExit(f'{source} check time is later than the snapshot manifest')
              if checked_at.astimezone(timezone.utc) - source_checked > maximum_source_lag:
                  raise SystemExit(f'{source} check time is too far behind the snapshot manifest')
              source_age = now - source_checked
              if source_age > maximum_age:
                  raise SystemExit(
                      f'{source} source check is stale: '
                      f'{source_age.total_seconds() / 3600:.1f} hours old'
                  )
          age = now - checked_at.astimezone(timezone.utc)
          if age > maximum_age:
              raise SystemExit(
                  f"Published research snapshot is stale: {age.total_seconds() / 3600:.1f} hours old"
              )
          print(f"Published research snapshot is current: {age.total_seconds() / 3600:.1f} hours old")
          PY
