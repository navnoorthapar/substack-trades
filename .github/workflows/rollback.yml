name: Emergency Pages Rollback

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Validate and Deploy Pages run ID to restore
        required: true
        type: string
      release_sha:
        description: Exact 40-character release SHA from that run
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to authorize the production restore
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-production
  queue: max

jobs:
  rollback:
    name: Restore verified production artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Reserve the action's complete ten-minute deployment window plus a bounded
    # exact-byte propagation smoke and incident diagnostics.
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out trusted rollback tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up deterministic Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prove rollback tooling is current main
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(
            git ls-remote --exit-code origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$remote_main" ]

      - name: Verify source run authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$CONFIRMATION" = "ROLLBACK" ]
          expected_workflow_id=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml" \
              --jq '.id'
          )
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$RUNNER_TEMP/source-run.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/source-jobs.json"
          python verify_workflow_run.py \
            --run-json "$RUNNER_TEMP/source-run.json" \
            --jobs-json "$RUNNER_TEMP/source-jobs.json" \
            --expected-workflow-id "$expected_workflow_id" \
            --expected-event push \
            --expected-event workflow_dispatch \
            --expected-head-sha "$RELEASE_SHA"

      - name: Download exact retained artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rollback-download"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "verified-pages-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/rollback-download"
          test -f "$RUNNER_TEMP/rollback-download/artifact.tar"
          test "$(
            find "$RUNNER_TEMP/rollback-download" -type f | wc -l | tr -d ' '
          )" = "1"
          python rollback_bundle.py extract \
            --archive "$RUNNER_TEMP/rollback-download/artifact.tar" \
            --output "$RUNNER_TEMP/verified-rollback"

      - name: Verify schema-neutral artifact attestation
        env:
          EXPECTED_REVISION: ${{ inputs.release_sha }}
        run: >-
          python rollback_bundle.py verify-attestation
          --bundle "$RUNNER_TEMP/verified-rollback"
          --expected-revision "$EXPECTED_REVISION"

      - name: Upload exact rollback Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/verified-rollback/site
          retention-days: 7

      - name: Refuse superseded rollback tooling
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(
            git ls-remote --exit-code origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$remote_main" ]

      - name: Deploy verified rollback
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000

      - name: Verify exact rollback is live
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ inputs.release_sha }}
        run: >-
          python rollback_bundle.py smoke
          --bundle "$RUNNER_TEMP/verified-rollback"
          --expected-revision "$EXPECTED_REVISION"
          --base-url "$DEPLOYED_URL"
          --retries 8
          --retry-delay 10
          --timeout 20
          --concurrency 12

      - name: Publish rollback incident guidance
        if: failure() && steps.deployment.outcome == 'success'
        run: >-
          echo "::error title=Rollback verification failed::The archived Pages
          artifact deployed but exact live verification failed. Preserve this
          run and continue the incident procedure in LAUNCH_RUNBOOK.md section 6."
